<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 530" width="1440" height="530" role="img" aria-labelledby="title desc">
 <title id="title">U1 OS: Your day. Your ideas. Your next chapter.</title>
 <desc id="desc">An original U1 OS brand cover with an illuminated orbital emblem, a midnight-blue background, and Life, Create, Earn workspace labels. This is a brand graphic, not a product screenshot.</desc>
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset=".55" stop-color="#0a2137"/><stop offset="1" stop-color="#08141e"/></linearGradient>
  <linearGradient id="word" x2=".8" y2="1"><stop stop-color="#f1fbff"/><stop offset=".55" stop-color="#6bddf6"/><stop offset="1" stop-color="#5d9dff"/></linearGradient>
  <radialGradient id="a"><stop stop-color="#168fc8" stop-opacity=".28"/><stop offset="1" stop-color="#168fc8" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#8ed6b2" stop-opacity=".2"/><stop offset="1" stop-color="#8ed6b2" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring"><stop stop-color="#82eeff"/><stop offset=".5" stop-color="#4087df"/><stop offset="1" stop-color="#9fd7e7"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#77b9d4" opacity=".16"/></pattern>
 </defs>
 <rect width="1440" height="530" rx="28" fill="url(#bg)"/>
 <rect width="1440" height="530" rx="28" fill="url(#dots)"/>
 <ellipse cx="1060" cy="210" rx="430" ry="400" fill="url(#a)"/>
 <ellipse cx="280" cy="520" rx="500" ry="280" fill="url(#b)"/>
 <rect x="1" y="1" width="1438" height="528" rx="27" fill="none" stroke="#7cd9ed" stroke-opacity=".25"/>
 <g transform="translate(1065 255)">
  <circle r="174" fill="#071929" stroke="#4a9fc0" stroke-opacity=".5"/>
  <circle r="147" fill="none" stroke="#65bddb" stroke-opacity=".24"/>
  <ellipse rx="207" ry="84" fill="none" stroke="url(#ring)" stroke-width="1.5" transform="rotate(-29)"/>
  <ellipse rx="91" ry="207" fill="none" stroke="#61c6e4" stroke-opacity=".45" transform="rotate(-29)"/>
  <circle r="195" fill="none" stroke="#7bd6ed" stroke-opacity=".12" stroke-dasharray="2 10"/>
  <text x="-87" y="29" font-family="Avenir Next,sans-serif" font-size="107" font-weight="600" letter-spacing="-10" fill="url(#word)">U1</text>
  <text x="-63" y="63" font-family="sans-serif" font-size="11" letter-spacing="8" fill="#83bed5">YOUR OS</text>
  <circle cx="-166" cy="122" r="5" fill="#a1f2ff"/>
  <circle cx="177" cy="-115" r="4" fill="#a1f2ff"/>
 </g>
 <g font-family="Avenir Next,sans-serif">
  <text x="70" y="77" fill="#94d9ed" font-size="13" font-weight="600" letter-spacing="5">U1 OS / YOUR WORLD, AMPLIFIED</text>
  <text x="66" y="180" fill="#f0f8fb" font-size="65" font-weight="600" letter-spacing="-2">Your day.</text>
  <text x="66" y="252" fill="#f0f8fb" font-size="65" font-weight="600" letter-spacing="-2">Your ideas.</text>
  <text x="66" y="324" fill="url(#word)" font-size="65" font-weight="600" letter-spacing="-2">Your next chapter.</text>
  <text x="70" y="371" fill="#a3c0d2" font-size="18">A personal workspace for life, creating and building a living.</text>
  <g transform="translate(70 424)" font-size="11" font-weight="600" letter-spacing="2">
   <rect width="110" height="39" rx="11" fill="#1b394a" stroke="#73d5e6" stroke-opacity=".4"/><text x="31" y="25" fill="#9be8f3">LIFE</text>
   <rect x="125" width="139" height="39" rx="11" fill="#303046" stroke="#eabacc" stroke-opacity=".3"/><text x="152" y="25" fill="#eed1de">CREATE</text>
   <rect x="279" width="115" height="39" rx="11" fill="#34332e" stroke="#e8c799" stroke-opacity=".3"/><text x="307" y="25" fill="#efd6b2">EARN</text>
  </g>
  <text x="1300" y="492" fill="#779cae" font-size="10" letter-spacing="1" text-anchor="end">LOCAL-FIRST / DEVELOPMENT BUILD</text>
 </g>
</svg>
